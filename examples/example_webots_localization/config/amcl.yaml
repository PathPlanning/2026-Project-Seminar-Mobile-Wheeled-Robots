amcl:
  ros__parameters:
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 15000
    update_min_d: 0.1
    update_min_a: 0.1
    laser_model_type: beam
    sigma_hit: 0.05
    laser_max_range: 3.5
    max_beams: 60
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
