PROTO CourseBox [
  field SFVec3f translation 0 0 0.05
  field SFVec3f size 0.1 0.1 0.1
  field SFColor color 0.0 1.0 0.0
  field SFFloat mass 1
  field SFString  name "box"
]
{
  Solid {
  translation IS translation
  name IS name
  children [
    Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness 1
          metalness 0
        }
      geometry DEF BOX Box {
        size IS size
      }
    }
  ]
  boundingObject USE BOX
  physics Physics {
    density -1
    mass IS mass
  }
}
}